services:
  - type: web
    name: xavierAIback
    env: python
    buildCommand: |
      # Make build.sh executable
      chmod +x ./build.sh
      # Run the build script
      ./build.sh
      # If any package fails to install, use the minimal app
      if [ $? -ne 0 ]; then
        echo "Using minimal app due to installation issues"
        cp app_minimal.py app.py
      fi
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: GRPC_PYTHON_BUILD_SYSTEM_OPENSSL
        value: 1
      - key: GRPC_PYTHON_BUILD_WITH_CYTHON
        value: 1
      - key: PIP_NO_BUILD_ISOLATION
        value: 1
      # Disable pip's dependency resolver
      - key: PIP_USE_PEP517
        value: 0
    buildFilter:
      paths:
        - requirements.txt
        - requirements-minimal.txt
        - requirements-no-grpc.txt
        - "**/*.py"
        - build.sh
        - apt-packages
