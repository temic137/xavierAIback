[phases.setup]
nixPkgs = ['python311', 'postgresql_16.dev', 'gcc']  # Use Python 3.11

[phases.install]
cmds = ['python -m venv --copies /opt/venv', '. /opt/venv/bin/activate', 'pip install -r requirements.txt']

[start]
cmd = 'gunicorn --bind 0.0.0.0:$PORT app:app'
